[project]
name = "mcp-aktools"
version = "0.1.14"
description = "MCP Server for stock market data"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["aktools", "akshare", "stock", "trading", "mcp", "llm"]
license = { text = "MIT" }
dependencies = [
    "akshare>=1.18.72",
    "cachetools>=7.1.4",
    "fastmcp>=3.4.4",
    "pydantic-settings>=2.14.2",
    "pandas-ta>=0.4.0",
    "pyarrow>=25.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "hypothesis>=6.158.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project.urls]
Homepage = "https://github.com/shotheadman/mcp-aktools"
Repository = "https://github.com/shotheadman/mcp-aktools.git"

[project.scripts]
mcp-aktools = "mcp_aktools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",
    "logging-format-interpolation",
    "logging-format-truncated",
]

[[tool.uv.index]]
url="https://pypi.tuna.tsinghua.edu.cn/simple"
default=true
